name: Testler

on:
  push:
    branches: [ main, 'claude/**' ]
  pull_request:

jobs:
  phpunit:
    name: PHP ${{ matrix.php }} + MySQL
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: klanlar_vadisi_test
        ports: [ '3306:3306' ]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10

    strategy:
      fail-fast: false
      matrix:
        php: [ '8.3', '8.4' ]

    steps:
      - uses: actions/checkout@v4

      - name: PHP kur
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo, pdo_mysql, pdo_sqlite, bcmath, intl, gd, zip
          coverage: none

      - name: Composer bağımlılıkları
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Ortam hazırla
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Testler (sqlite, bellek içi)
        run: php artisan test

      - name: Göçler MySQL üzerinde çalışıyor mu
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: klanlar_vadisi_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: |
          php artisan migrate:fresh --force
          php artisan db:seed --class=CatalogSeeder --force

      - name: Kod biçimi (Pint)
        run: vendor/bin/pint --test
