name: Oyun Dengesi

# Denge, katalog verisi her değiştiğinde ölçülür. Saldırı/savunma dengesi
# hedef bandın dışına çıkarsa iş akışı uyarı verir (hata vermez — denge
# kararı insana aittir).
on:
  pull_request:
    paths:
      - 'database/seeders/data/**'
      - 'config/game.php'
      - 'app/Services/Combat/**'
      - 'app/Services/LayoutGenerator.php'
  workflow_dispatch:

jobs:
  balance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_sqlite, bcmath, intl, gd, zip
          coverage: none

      - run: composer install --prefer-dist --no-interaction --no-progress

      - name: Ortam ve veritabanı
        run: |
          cp .env.example .env
          sed -i 's|^DB_CONNECTION=mysql|DB_CONNECTION=sqlite|' .env
          sed -i 's|^DB_DATABASE=klanlar_vadisi|DB_DATABASE=database/database.sqlite|' .env
          php artisan key:generate
          touch database/database.sqlite
          php artisan migrate --force
          php artisan db:seed --class=CatalogSeeder --force

      - name: Denge ölçümü
        run: php artisan game:balance --runs=3 | tee balance.txt

      - name: Özeti iş akışına yaz
        if: always()
        run: |
          echo '### Oyun Dengesi' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat balance.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
