<svg xmlns="http://www.w3.org/2000/svg" width="408" height="416"
    viewBox="0 0 408 416">

  <defs>
    <filter id="yumusak" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="cokYumusak" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="hafifYumusak" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
    <filter id="parilti" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Taş dokusu: ince gürültü -->
    <filter id="tasDoku" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="7" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="g"/>
      <feComposite in="SourceGraphic" in2="g" operator="arithmetic"
        k1="0.18" k2="0.86" k3="0" k4="0"/>
    </filter>

    <!-- Keçe dokusu: yumuşak lekeler -->
    <filter id="keceDoku" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="4" seed="3" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="g"/>
      <feComposite in="SourceGraphic" in2="g" operator="arithmetic"
        k1="0.10" k2="0.93" k3="0" k4="0"/>
    </filter>

    <linearGradient id="gokIsik" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="atesIsik" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd98a" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#f2763a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f2763a" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="buyuIsik" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="0.45" stop-color="#8ad7ff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#8ad7ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g transform="translate(204,212)">

    <ellipse cx="0" cy="98" rx="176.64" ry="88.32"
      fill="#1b1206" opacity="0.3" filter="url(#yumusak)"/>
    
    <g opacity="1">
      <path d="M0,0 L-147.2,73.6 L-147.2,65.6 L0,-8 Z" fill="#5a544a"/>
      <path d="M-147.2,73.6 L0,147.2 L0,139.2 L-147.2,65.6 Z" fill="#433e36"/>
      <path d="M0,-8 L147.2,65.6 L0,139.2 L-147.2,65.6 Z" fill="#7b756c"/>
    </g>
    <g filter="url(#tasDoku)">
      
    <g opacity="1">
      <path d="M0,-8 L-108.8,46.4 L-108.8,-5.6 L0,-60 Z" fill="#837a6e"/>
      <path d="M-108.8,46.4 L0,100.8 L0,48.8 L-108.8,-5.6 Z" fill="#615a52"/>
      <path d="M0,-60 L108.8,-5.6 L0,48.8 L-108.8,-5.6 Z" fill="#a7a096"/>
    </g>
    </g>
    <!-- Baca -->
    
    <g opacity="1">
      <path d="M0,-52 L-44.8,-29.6 L-44.8,-105.6 L0,-128 Z" fill="#736c62"/>
      <path d="M-44.8,-29.6 L0,-7.2 L0,-83.2 L-44.8,-105.6 Z" fill="#555048"/>
      <path d="M0,-128 L44.8,-105.6 L0,-83.2 L-44.8,-105.6 Z" fill="#9a938b"/>
    </g>
    <!-- Ocak ağzı ve alev -->
    <path d="M-24,102 q24,-30 48,0 Z" fill="#160e05"/>
    
    <g transform="translate(0,98)">
      <ellipse cx="0" cy="0" rx="37.4" ry="22" fill="url(#atesIsik)"/>
      <path d="M0,-28.6 C-14.3,-14.3 -12.1,-3.3 0,2.2
               C12.1,-3.3 14.3,-14.3 0,-28.6 Z"
        fill="#f2763a"/>
      <path d="M0,-17.6 C-7.7,-8.8 -6.6,-1.1 0,1.1
               C6.6,-1.1 7.7,-8.8 0,-17.6 Z"
        fill="#ffd98a"/>
      <!-- Odunlar -->
      <path d="M-15.4,3.3 L15.4,-2.2
               M-14.3,-2.2 L15.4,3.3"
        stroke="#5e472c" stroke-width="4.4" stroke-linecap="round"/>
    </g>
    <!-- Duman -->
    <g opacity="0.45">
      <circle cx="2" cy="-8" r="11" fill="#c9c0b2"/>
      <circle cx="11" cy="-24" r="8" fill="#c9c0b2"/>
      <circle cx="-4" cy="-36" r="6" fill="#c9c0b2"/>
    </g>
    <g>
    <path d="M22,118 l2.4,-5.6
          h12.8 l2.4,5.6 Z"
        fill="#8f9aa8" stroke="#5d646d" stroke-width="0.9"/><path d="M36.4,118 l2.4,-5.6
          h12.8 l2.4,5.6 Z"
        fill="#8f9aa8" stroke="#5d646d" stroke-width="0.9"/><path d="M22,110.8 l2.4,-5.6
          h12.8 l2.4,5.6 Z"
        fill="#8f9aa8" stroke="#5d646d" stroke-width="0.9"/><path d="M36.4,110.8 l2.4,-5.6
          h12.8 l2.4,5.6 Z"
        fill="#8f9aa8" stroke="#5d646d" stroke-width="0.9"/>
  </g>
  
  </g>
</svg>