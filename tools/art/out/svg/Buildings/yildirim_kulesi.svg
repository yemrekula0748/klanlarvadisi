<svg xmlns="http://www.w3.org/2000/svg" width="408" height="456"
    viewBox="0 0 408 456">

  <defs>
    <filter id="yumusak" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="cokYumusak" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="hafifYumusak" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
    <filter id="parilti" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Taş dokusu: ince gürültü -->
    <filter id="tasDoku" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="7" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="g"/>
      <feComposite in="SourceGraphic" in2="g" operator="arithmetic"
        k1="0.18" k2="0.86" k3="0" k4="0"/>
    </filter>

    <!-- Keçe dokusu: yumuşak lekeler -->
    <filter id="keceDoku" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="4" seed="3" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="g"/>
      <feComposite in="SourceGraphic" in2="g" operator="arithmetic"
        k1="0.10" k2="0.93" k3="0" k4="0"/>
    </filter>

    <linearGradient id="gokIsik" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="atesIsik" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd98a" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#f2763a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f2763a" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="buyuIsik" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="0.45" stop-color="#8ad7ff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#8ad7ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g transform="translate(204,252)">

    <ellipse cx="0" cy="98" rx="176.64" ry="88.32"
      fill="#1b1206" opacity="0.3" filter="url(#yumusak)"/>
    
    <g opacity="1">
      <path d="M0,0 L-147.2,73.6 L-147.2,65.6 L0,-8 Z" fill="#474250"/>
      <path d="M-147.2,73.6 L0,147.2 L0,139.2 L-147.2,65.6 Z" fill="#34313b"/>
      <path d="M0,-8 L147.2,65.6 L0,139.2 L-147.2,65.6 Z" fill="#696572"/>
    </g>
    <g><g><path d="M-88.32,88
      L-88.32,10
      A88.32,44.16 0 0 1 88.32,10
      L88.32,88
      A88.32,44.16 0 0 0 -88.32,88 Z"
      fill="#736d80"/><path d="M-88.32,88
      L-88.32,10
      A88.32,44.16 0 0 1 0,-34.16
      L0,132.16 Z"
      fill="#9590a0" opacity="0.6"/><path d="M88.32,88
      L88.32,10
      A88.32,44.16 0 0 0 0,-34.16
      L0,132.16 Z"
      fill="#514d5a" opacity="0.55"/><path d="M-88.32,62 A88.32,44.16 0 0 0 88.32,62"
        fill="none" stroke="#47434f" stroke-width="2" opacity="0.5"/><path d="M-88.32,36 A88.32,44.16 0 0 0 88.32,36"
        fill="none" stroke="#47434f" stroke-width="2" opacity="0.5"/><ellipse cx="0" cy="10" rx="88.32" ry="44.16"
      fill="#9d98a7"/></g><rect x="81.32" y="-6" width="14" height="18" rx="2"
        fill="#615e6b"/><rect x="20.29" y="36" width="14" height="18" rx="2"
        fill="#615e6b"/><rect x="-78.45" y="19.96" width="14" height="18" rx="2"
        fill="#9894a3"/><rect x="-78.45" y="-31.96" width="14" height="18" rx="2"
        fill="#9894a3"/><rect x="20.29" y="-48" width="14" height="18" rx="2"
        fill="#615e6b"/></g>
    <!-- Yada taşı -->
    <g transform="translate(0,-8)">
      <path d="M0,-30 L17,-6 L9,24 L-9,24 L-17,-6 Z" fill="#7fd4e8" opacity="0.95"/>
      <path d="M0,-30 L17,-6 L0,2 Z" fill="#ffffff" opacity="0.6"/>
    </g>
    
    <g>
      <ellipse cx="0" cy="-8" rx="48" ry="26.4" fill="url(#buyuIsik)"/>
      <circle cx="19.2" cy="-24.8"
        r="1.92" fill="#7fd4e8" opacity="0.5"/><circle cx="17.21" cy="-35.6"
        r="2.76" fill="#7fd4e8" opacity="0.66"/><circle cx="-8.01" cy="-46.4"
        r="3.6" fill="#7fd4e8" opacity="0.8200000000000001"/><circle cx="-17.3" cy="-57.2"
        r="1.92" fill="#7fd4e8" opacity="0.5"/><circle cx="-24.87" cy="-24.8"
        r="2.76" fill="#7fd4e8" opacity="0.66"/><circle cx="-8.01" cy="-35.6"
        r="3.6" fill="#7fd4e8" opacity="0.8200000000000001"/><circle cx="11.97" cy="-46.4"
        r="1.92" fill="#7fd4e8" opacity="0.5"/>
    </g>
    <!-- Yıldırım çatalları -->
    <path d="M-36,-24 l12,16 l-7,3 l13,17"
      stroke="#7fd4e8" stroke-width="2.6" fill="none" stroke-linecap="round" opacity="0.85"/>
    <path d="M34,-30 l-11,15 l7,3 l-12,16"
      stroke="#7fd4e8" stroke-width="2.6" fill="none" stroke-linecap="round" opacity="0.7"/>
  
  </g>
</svg>