<svg xmlns="http://www.w3.org/2000/svg" width="408" height="376"
    viewBox="0 0 408 376">

  <defs>
    <filter id="yumusak" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="cokYumusak" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="hafifYumusak" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
    <filter id="parilti" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Taş dokusu: ince gürültü -->
    <filter id="tasDoku" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="7" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="g"/>
      <feComposite in="SourceGraphic" in2="g" operator="arithmetic"
        k1="0.18" k2="0.86" k3="0" k4="0"/>
    </filter>

    <!-- Keçe dokusu: yumuşak lekeler -->
    <filter id="keceDoku" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="4" seed="3" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="g"/>
      <feComposite in="SourceGraphic" in2="g" operator="arithmetic"
        k1="0.10" k2="0.93" k3="0" k4="0"/>
    </filter>

    <linearGradient id="gokIsik" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="atesIsik" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd98a" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#f2763a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f2763a" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="buyuIsik" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="0.45" stop-color="#8ad7ff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#8ad7ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g transform="translate(204,172)">

    <ellipse cx="0" cy="98" rx="176.64" ry="88.32"
      fill="#1b1206" opacity="0.3" filter="url(#yumusak)"/>
    
    <g opacity="1">
      <path d="M0,0 L-147.2,73.6 L-147.2,66.6 L0,-7 Z" fill="#5a544a"/>
      <path d="M-147.2,73.6 L0,147.2 L0,140.2 L-147.2,66.6 Z" fill="#433e36"/>
      <path d="M0,-7 L147.2,66.6 L0,140.2 L-147.2,66.6 Z" fill="#7b756c"/>
    </g>
    
    <g>
      
    <g opacity="1">
      <path d="M0,-7 L-83.2,34.6 L-83.2,-5.4 L0,-47 Z" fill="#7f623f"/>
      <path d="M-83.2,34.6 L32,92.2 L32,52.2 L-83.2,-5.4 Z" fill="#5e482e"/>
      <path d="M0,-47 L115.2,10.6 L32,52.2 L-83.2,-5.4 Z" fill="#a48b6d"/>
    </g>
      
    <g>
      <path d="M0,-55.96 L133.12,10.6 L16,-39.4 Z" fill="#a05e5a"/>
      <path d="M133.12,10.6 L32,61.16 L16,-39.4 Z" fill="#5e1b18"/>
      <path d="M32,61.16 L-101.12,-5.4 L16,-39.4 Z" fill="#4a1513"/>
      <path d="M-101.12,-5.4 L0,-55.96 L16,-39.4 Z" fill="#822924"/>
    </g>
    </g>
    <!-- Örs -->
    <g transform="translate(6,114)">
      <path d="M-18,0 h36 l-5,-9 h-26 Z" fill="#464d57"/>
      <path d="M-13,-9 h26 l-4,-12 h-18 Z" fill="#6c7480"/>
      <path d="M-24,-21 q11,-5 22,0 l0,5 q-11,4 -22,0 Z" fill="#6c7480"/>
    </g>
    <!-- Çekiç -->
    <g transform="translate(-32,102) rotate(-40)">
      <rect x="-1.8" y="-26" width="3.6" height="30" rx="1.4" fill="#8a6a44"/>
      <rect x="-9" y="-32" width="18" height="10" rx="2" fill="#464d57"/>
    </g>
    
    <g transform="translate(42,100)">
      <ellipse cx="0" cy="0" rx="27.2" ry="16" fill="url(#atesIsik)"/>
      <path d="M0,-20.8 C-10.4,-10.4 -8.8,-2.4 0,1.6
               C8.8,-2.4 10.4,-10.4 0,-20.8 Z"
        fill="#f2763a"/>
      <path d="M0,-12.8 C-5.6,-6.4 -4.8,-0.8 0,0.8
               C4.8,-0.8 5.6,-6.4 0,-12.8 Z"
        fill="#ffd98a"/>
      <!-- Odunlar -->
      <path d="M-11.2,2.4 L11.2,-1.6
               M-10.4,-1.6 L11.2,2.4"
        stroke="#5e472c" stroke-width="3.2" stroke-linecap="round"/>
    </g>
    <!-- Kıvılcımlar -->
    <circle cx="-10" cy="92"
      r="1.3" fill="#ffd98a" opacity="0.85"/><circle cx="-1" cy="85"
      r="2.1" fill="#ffd98a" opacity="0.85"/><circle cx="8" cy="78"
      r="1.3" fill="#ffd98a" opacity="0.85"/><circle cx="17" cy="92"
      r="2.1" fill="#ffd98a" opacity="0.85"/><circle cx="26" cy="85"
      r="1.3" fill="#ffd98a" opacity="0.85"/>
  
  </g>
</svg>