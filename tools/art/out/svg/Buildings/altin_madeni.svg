<svg xmlns="http://www.w3.org/2000/svg" width="408" height="346"
    viewBox="0 0 408 346">

  <defs>
    <filter id="yumusak" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="cokYumusak" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="hafifYumusak" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
    <filter id="parilti" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Taş dokusu: ince gürültü -->
    <filter id="tasDoku" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="7" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="g"/>
      <feComposite in="SourceGraphic" in2="g" operator="arithmetic"
        k1="0.18" k2="0.86" k3="0" k4="0"/>
    </filter>

    <!-- Keçe dokusu: yumuşak lekeler -->
    <filter id="keceDoku" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="4" seed="3" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="g"/>
      <feComposite in="SourceGraphic" in2="g" operator="arithmetic"
        k1="0.10" k2="0.93" k3="0" k4="0"/>
    </filter>

    <linearGradient id="gokIsik" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="atesIsik" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd98a" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#f2763a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f2763a" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="buyuIsik" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="0.45" stop-color="#8ad7ff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#8ad7ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g transform="translate(204,142)">

    <ellipse cx="0" cy="98" rx="176.64" ry="88.32"
      fill="#1b1206" opacity="0.3" filter="url(#yumusak)"/>
    
    <g opacity="1">
      <path d="M0,0 L-160,80 L-160,73 L0,-7 Z" fill="#907048"/>
      <path d="M-160,80 L0,160 L0,153 L-160,73 Z" fill="#6a5335"/>
      <path d="M0,-7 L160,73 L0,153 L-160,73 Z" fill="#b29775"/>
    </g>
    <g><path d="M-7.62,90.79 l4.73,-9.45
        l11.55,-1.26 l4.73,10.71 Z"
      fill="#625b52"/><path d="M-51.34,92.44 l7.09,-14.17
        l17.33,-1.89 l7.09,16.07 Z"
      fill="#8d867b"/><path d="M-59.88,73.21 l9.45,-18.9
        l23.1,-2.52 l9.45,21.42 Z"
      fill="#8d867b"/><path d="M-10.91,71.56 l4.73,-9.45
        l11.55,-1.26 l4.73,10.71 Z"
      fill="#625b52"/></g>
    <!-- Maden ağzı -->
    <path d="M-34,90 q34,-44 68,0 Z" fill="#38352f"/>
    <path d="M-28,90 q28,-36 56,0 Z" fill="#120d06"/>
    <!-- Ahşap destek kirişleri -->
    <path d="M-30,90 l0,-26 M30,90 l0,-26
             M-34,64 h68" stroke="#5e472c" stroke-width="5"
      stroke-linecap="round" fill="none"/>
    <g><ellipse cx="15.55" cy="110" rx="6.65" ry="3.42"
          fill="#f0b63c" stroke="#9c7627" stroke-width="0.8"/><ellipse cx="26" cy="110" rx="6.65" ry="3.42"
          fill="#f0b63c" stroke="#9c7627" stroke-width="0.8"/><ellipse cx="36.45" cy="110" rx="6.65" ry="3.42"
          fill="#f0b63c" stroke="#9c7627" stroke-width="0.8"/><ellipse cx="15.55" cy="105.25" rx="6.65" ry="3.42"
          fill="#f0b63c" stroke="#9c7627" stroke-width="0.8"/><ellipse cx="26" cy="105.25" rx="6.65" ry="3.42"
          fill="#f0b63c" stroke="#9c7627" stroke-width="0.8"/><ellipse cx="36.45" cy="105.25" rx="6.65" ry="3.42"
          fill="#f0b63c" stroke="#9c7627" stroke-width="0.8"/><ellipse cx="20.3" cy="100.5" rx="6.65" ry="3.42"
          fill="#f0b63c" stroke="#9c7627" stroke-width="0.8"/><ellipse cx="30.75" cy="100.5" rx="6.65" ry="3.42"
          fill="#f0b63c" stroke="#9c7627" stroke-width="0.8"/><ellipse cx="41.2" cy="100.5" rx="6.65" ry="3.42"
          fill="#f0b63c" stroke="#9c7627" stroke-width="0.8"/></g>
    <!-- Kazma -->
    <g transform="translate(-44,108) rotate(-28)">
      <rect x="-2" y="-26" width="4" height="30" rx="1.5" fill="#8a6a44"/>
      <path d="M-13,-26 q13,-7 26,0 q-13,5 -26,0 Z" fill="#6c7480"/>
    </g>
  
  </g>
</svg>