<svg xmlns="http://www.w3.org/2000/svg" width="408" height="376"
    viewBox="0 0 408 376">

  <defs>
    <filter id="yumusak" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="cokYumusak" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="hafifYumusak" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
    <filter id="parilti" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Taş dokusu: ince gürültü -->
    <filter id="tasDoku" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="7" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="g"/>
      <feComposite in="SourceGraphic" in2="g" operator="arithmetic"
        k1="0.18" k2="0.86" k3="0" k4="0"/>
    </filter>

    <!-- Keçe dokusu: yumuşak lekeler -->
    <filter id="keceDoku" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="4" seed="3" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="g"/>
      <feComposite in="SourceGraphic" in2="g" operator="arithmetic"
        k1="0.10" k2="0.93" k3="0" k4="0"/>
    </filter>

    <linearGradient id="gokIsik" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="atesIsik" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd98a" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#f2763a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f2763a" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="buyuIsik" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="0.45" stop-color="#8ad7ff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#8ad7ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g transform="translate(204,172)">

    <ellipse cx="0" cy="98" rx="176.64" ry="88.32"
      fill="#1b1206" opacity="0.3" filter="url(#yumusak)"/>
    
    <g opacity="1">
      <path d="M0,0 L-147.2,73.6 L-147.2,66.6 L0,-7 Z" fill="#5a544a"/>
      <path d="M-147.2,73.6 L0,147.2 L0,140.2 L-147.2,66.6 Z" fill="#433e36"/>
      <path d="M0,-7 L147.2,66.6 L0,140.2 L-147.2,66.6 Z" fill="#7b756c"/>
    </g>
    <g filter="url(#tasDoku)">
      
    <g opacity="1">
      <path d="M0,-7 L-115.2,50.6 L-115.2,2.6 L0,-55 Z" fill="#837a6e"/>
      <path d="M-115.2,50.6 L0,108.2 L0,60.2 L-115.2,2.6 Z" fill="#615a52"/>
      <path d="M0,-55 L115.2,2.6 L0,60.2 L-115.2,2.6 Z" fill="#a7a096"/>
    </g>
    </g>
    <!-- Sandık kapağı (gövdeye oturur) -->
    
    <g opacity="1">
      <path d="M0,-55 L-118.4,4.2 L-118.4,-7.8 L0,-67 Z" fill="#7f623f"/>
      <path d="M-118.4,4.2 L0,63.4 L0,51.4 L-118.4,-7.8 Z" fill="#5e482e"/>
      <path d="M0,-67 L118.4,-7.8 L0,51.4 L-118.4,-7.8 Z" fill="#a48b6d"/>
    </g>
    
    <g>
      <path d="M0,-68.92 L122.24,-7.8 L0,-33.8 Z" fill="#887763"/>
      <path d="M122.24,-7.8 L0,53.32 L0,-33.8 Z" fill="#463521"/>
      <path d="M0,53.32 L-122.24,-7.8 L0,-33.8 Z" fill="#37291a"/>
      <path d="M-122.24,-7.8 L0,-68.92 L0,-33.8 Z" fill="#614b30"/>
    </g>
    <path d="M-46,42 h92" stroke="#a8762a" stroke-width="4"/>
    <!-- Altın taşması -->
    <g><ellipse cx="-9.35" cy="46" rx="5.95" ry="3.06"
          fill="#f0b63c" stroke="#9c7627" stroke-width="0.8"/><ellipse cx="0" cy="46" rx="5.95" ry="3.06"
          fill="#f0b63c" stroke="#9c7627" stroke-width="0.8"/><ellipse cx="9.35" cy="46" rx="5.95" ry="3.06"
          fill="#f0b63c" stroke="#9c7627" stroke-width="0.8"/><ellipse cx="-9.35" cy="41.75" rx="5.95" ry="3.06"
          fill="#f0b63c" stroke="#9c7627" stroke-width="0.8"/><ellipse cx="0" cy="41.75" rx="5.95" ry="3.06"
          fill="#f0b63c" stroke="#9c7627" stroke-width="0.8"/><ellipse cx="9.35" cy="41.75" rx="5.95" ry="3.06"
          fill="#f0b63c" stroke="#9c7627" stroke-width="0.8"/><ellipse cx="-5.1" cy="37.5" rx="5.95" ry="3.06"
          fill="#f0b63c" stroke="#9c7627" stroke-width="0.8"/><ellipse cx="4.25" cy="37.5" rx="5.95" ry="3.06"
          fill="#f0b63c" stroke="#9c7627" stroke-width="0.8"/><ellipse cx="13.6" cy="37.5" rx="5.95" ry="3.06"
          fill="#f0b63c" stroke="#9c7627" stroke-width="0.8"/></g>
    <!-- Demir kuşaklar -->
    <path d="M-28,100 l0,-48 M28,100 l0,-48"
      stroke="#464d57" stroke-width="5"/>
    <path d="M-15,88
                   C-15,74.5 -3,71.5 0,79
                   C3,71.5 15,74.5 15,88"
      fill="none" stroke="#e0a63c" stroke-width="2.6" stroke-linecap="round"/>
  
  </g>
</svg>