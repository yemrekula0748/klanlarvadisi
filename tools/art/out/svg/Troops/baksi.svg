        q8.16,15.3 16.32,0
        q-8.16,6.12 -16.32,0 Z" fill="#d8d2c4"/><path d="M36.78,36.84
        q11.22,-13.26 22.44,0 Z" fill="#3f3458"/><path d="M43,29.7
        q-3,-14 -6,-20" stroke="#e9e1cf" stroke-width="2"
        fill="none" stroke-linecap="round"/><path d="M48,29.7
        q0,-14 0,-20" stroke="#e9e1cf" stroke-width="2"
        fill="none" stroke-linecap="round"/><path d="M53,29.7
        q3,-14 6,-20" stroke="#e9e1cf" stroke-width="2"
        fill="none" stroke-linecap="round"/>
    <!-- Davul -->
    <g transform="translate(26,77.2)">
      <ellipse cx="0" cy="0" rx="13" ry="14" fill="#e9e1cf" stroke="#5e472c" stroke-width="2.6"/>
      <g transform="translate(0,0) scale(0.5)">
      <path d="M0,7 L0,-6 M0,-2 L-5,-6 M0,-2 L5,-6 M0,2 L-4,-1 M0,2 L4,-1" fill="none" stroke="#b7362c" stroke-width="4.8"
