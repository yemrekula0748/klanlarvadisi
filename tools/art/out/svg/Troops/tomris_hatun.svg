      fill="#e8c49e"/><ellipse cx="43.84" cy="30.74" rx="6.55"
      ry="10.71" fill="#eacaa8" opacity="0.5"/><circle cx="44.6" cy="31.74" r="1.5" fill="#2b1a10"/><circle cx="51.4" cy="31.74" r="1.5" fill="#2b1a10"/>
    <!-- Saç ve taç -->
    <path d="M37,28.74 q-9,24 -3,38 q9,-14 7,-36 Z" fill="#2e1c10"/>
    <path d="M37,20.74 l3,-9 l4,7 l4,-10 l4,10 l4,-7 l3,9 Z" fill="#e0a63c"/>
    
