    <path d="M-2,-38 l2,-6 l2,6 Z" fill="#9197a0"/>
    <rect x="-7" y="0" width="14" height="3.4" rx="1.6" fill="#a8762a"/>
    <rect x="-2" y="3" width="4" height="9" rx="1.6" fill="#5e472c"/>
  </g>
    <!-- Altın taç bandı -->
    <path d="M37,18.7 h22" stroke="#e0a63c" stroke-width="3.4"/>
  
    
</svg>