<svg xmlns="http://www.w3.org/2000/svg" width="96" height="112"
    viewBox="0 0 96 112">

  <defs>
    <filter id="yumusak" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="cokYumusak" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="hafifYumusak" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
    <filter id="parilti" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Taş dokusu: ince gürültü -->
    <filter id="tasDoku" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="7" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="g"/>
      <feComposite in="SourceGraphic" in2="g" operator="arithmetic"
        k1="0.18" k2="0.86" k3="0" k4="0"/>
    </filter>

    <!-- Keçe dokusu: yumuşak lekeler -->
    <filter id="keceDoku" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="4" seed="3" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="g"/>
      <feComposite in="SourceGraphic" in2="g" operator="arithmetic"
        k1="0.10" k2="0.93" k3="0" k4="0"/>
    </filter>

    <linearGradient id="gokIsik" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="atesIsik" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd98a" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#f2763a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f2763a" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="buyuIsik" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="0.45" stop-color="#8ad7ff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#8ad7ff" stop-opacity="0"/>
    </radialGradient>
  </defs>


      <ellipse cx="48" cy="104" rx="20" ry="7.2"
        fill="#1b1206" opacity="0.3" filter="url(#hafifYumusak)"/>
      <ellipse cx="48" cy="76" rx="30" ry="34" fill="url(#buyuIsik)"/>
      
    <path d="M40,75.6 l-2,25.08 l8,0 l2,-25.08 Z"
      fill="#304630"/><path d="M50,75.6 l2,25.08 l8,0 l-2,-25.08 Z"
      fill="#3a533a"/><path d="M36,99 h12 v5 h-14 Z" fill="#5e472c"/><path d="M50,99 h12 v5 h-14 Z" fill="#715d45"/><path d="M35,50.52
      q13,-5 26,0 l3,34.32 q-16,6 -32,0 Z" fill="#4a6b4a"/><path d="M48,48.52 l0,38.32"
      stroke="#e0a63c" stroke-width="2.4"/><path d="M34,71.8 q14,6 28,0"
      stroke="#e0a63c" stroke-width="3" fill="none"/><path d="M35,53.52 q-8,10 -7,24 l7,2 q2,-14 6,-22 Z"
      fill="#415e41"/><path d="M61,53.52 q8,10 7,24 l-7,2 q-2,-14 -6,-22 Z"
      fill="#587758"/><ellipse cx="48" cy="34.81" rx="11.22" ry="12.12"
      fill="#e0bb92"/><ellipse cx="44.07" cy="34.81" rx="6.17"
      ry="10.1" fill="#e3c29d" opacity="0.5"/><circle cx="44.6" cy="35.81" r="1.5" fill="#2b1a10"/><circle cx="51.4" cy="35.81" r="1.5" fill="#2b1a10"/><path d="M39.02,38.74
        q8.98,16.83 17.95,0
        q-8.98,6.73 -17.95,0 Z" fill="#e4ddd0"/><path d="M35.66,30.32
        q12.34,-14.59 24.68,0 Z" fill="#35503a"/><path d="M43,22.47
        q-3,-14 -6,-20" stroke="#e9e1cf" stroke-width="2"
        fill="none" stroke-linecap="round"/><path d="M48,22.47
        q0,-14 0,-20" stroke="#e9e1cf" stroke-width="2"
        fill="none" stroke-linecap="round"/><path d="M53,22.47
        q3,-14 6,-20" stroke="#e9e1cf" stroke-width="2"
        fill="none" stroke-linecap="round"/>
    <!-- Kopuz -->
    <g transform="translate(28,74.52) rotate(-18)">
      <ellipse cx="0" cy="6" rx="11" ry="15" fill="#8a6a44"/>
      <rect x="-2.4" y="-34" width="4.8" height="34" rx="2" fill="#5e472c"/>
      <path d="M-5,-4 l10,0 M-5,0 l10,0" stroke="#e9e1cf" stroke-width="1.2"/>
      <circle cx="0" cy="4" r="4" fill="#5e472c"/>
